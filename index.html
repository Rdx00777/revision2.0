<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusRevise PWA</title>
    <style>
    :root {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --text-primary: #ffffff;
        --text-secondary: #a0a0a0;
        --accent: #bb86fc;
        --accent-variant: #3700b3;
        --danger: #cf6679;
        --nav-height: 60px;
    }

    body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        margin: 0;
        padding: 0 0 var(--nav-height) 0;
        overflow-x: hidden;
    }

    /* Navigation */
    .navbar {
        position: fixed;
        bottom: 0;
        width: 100%;
        height: var(--nav-height);
        background-color: var(--card-bg);
        display: flex;
        justify-content: space-around;
        align-items: center;
        border-top: 1px solid #333;
        z-index: 100;
    }

    .nav-item {
        color: var(--text-secondary);
        font-size: 0.9rem;
        cursor: pointer;
        padding: 10px;
    }

    .nav-item.active {
        color: var(--accent);
        font-weight: bold;
    }

    /* Layout */
    main {
        padding: 20px;
        max-width: 600px;
        margin: 0 auto;
    }

    .view {
        display: none;
        animation: fadeIn 0.3s ease;
    }

    .view.active {
        display: block;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Cards & Inputs */
    .card {
        background-color: var(--card-bg);
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 15px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .stats-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 20px;
    }

    input {
        background: #2c2c2c;
        border: 1px solid #333;
        color: white;
        padding: 12px;
        border-radius: 8px;
        width: 100%;
        margin-bottom: 10px;
        box-sizing: border-box;
    }

    .btn-primary {
        background-color: var(--accent);
        color: black;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        transition: transform 0.1s;
    }

    .btn-primary:active { transform: scale(0.98); }

    .btn-danger {
        background-color: var(--danger);
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 50px;
        font-size: 1.2rem;
        cursor: pointer;
        margin-top: 20px;
    }

    /* Lists */
    .list-group {
        list-style: none;
        padding: 0;
    }

    .list-item {
        background-color: var(--card-bg);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .topic-meta {
        font-size: 0.8rem;
        color: var(--text-secondary);
    }

    /* Timer Overlay (Blackout Mode) */
    #focus-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000000;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    #focus-overlay.hidden {
        display: none;
    }

    #overlay-timer {
        font-size: 6rem;
        font-weight: bold;
        font-variant-numeric: tabular-nums;
        margin: 0;
    }

    .empty-state {
        text-align: center;
        color: var(--text-secondary);
        font-style: italic;
        margin-top: 20px;
    }
</style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

    <nav class="navbar">
        <div class="nav-item active" onclick="showView('dashboard')">Dashboard</div>
        <div class="nav-item" onclick="showView('subjects')">Subjects</div>
        <div class="nav-item" onclick="showView('timer')">Pomodoro</div>
    </nav>

    <main id="app">
        
        <section id="dashboard-view" class="view active">
            <h2>Dashboard</h2>
            <div class="stats-container">
                <div class="card">
                    <h3>To Review Today</h3>
                    <h1 id="review-count">0</h1>
                </div>
                <div class="card">
                    <h3>Total Topics</h3>
                    <h1 id="total-count">0</h1>
                </div>
            </div>
            <h3>Due for Revision</h3>
            <ul id="due-list" class="list-group">
                <p class="empty-state">No revisions due today!</p>
            </ul>
        </section>

        <section id="subjects-view" class="view">
            <h2>Manage Subjects</h2>
            <div class="input-group">
                <input type="text" id="new-subject-name" placeholder="Subject Name">
                <input type="text" id="new-topic-name" placeholder="Topic Name">
                <button onclick="addTopic()" class="btn-primary">Add</button>
            </div>
            <div id="subjects-list">
                </div>
        </section>

        <section id="timer-view" class="view">
            <h2>Focus Timer</h2>
            <div class="timer-setup">
                <input type="number" id="timer-minutes" value="25" min="1">
                <span class="label">Minutes</span>
            </div>
            <button onclick="startTimer()" class="btn-primary btn-large">Start Focus</button>
        </section>

    </main>

    <div id="focus-overlay" class="hidden">
        <div class="focus-content">
            <h1 id="overlay-timer">25:00</h1>
            <p id="focus-status">Focus...</p>
            <button onclick="stopTimer()" class="btn-danger">Stop / Dismiss Alarm</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
